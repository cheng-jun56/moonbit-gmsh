name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: moon fmt --check
      - run: moon check --target all
      - run: moon test --target js
      - run: moon test --target wasm-gc
      - run: moon build --target js --release
      - run: moon info
      - run: git diff --exit-code -- '*.mbti'
      - run: node tools/check-cli.mjs
      - run: python -m pip install -r tools/requirements.txt
      - name: Independent format and geometry reference matrix
        timeout-minutes: 5
        run: python tools/verify-reference.py --skip-benchmark --evidence evidence/reference-ci.json
      - run: python tools/verify-boundary.py
      - run: moon run examples/extract_boundary --target js
      - run: moon run examples/extract_boundary --target wasm-gc
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r tools/requirements-public.txt
      - run: python tools/verify-public-t1.py --evidence evidence/public-t1-ci.json
      - run: node examples/run-public-coverage.mjs t1-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmsh-reference-evidence
          path: |
            evidence/reference-ci.json
            evidence/public-t1-ci.json
          if-no-files-found: ignore
