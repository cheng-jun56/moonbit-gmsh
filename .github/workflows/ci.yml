name: local-contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target all
      - run: moon test --target js
      - run: moon test --target wasm-gc
      - run: moon build --target js --release
      - run: node tools/check-cli.mjs
      - run: moon run examples/extract_boundary --target js
      - run: moon run examples/extract_boundary --target wasm-gc
      - run: moon info
      - run: git diff --exit-code
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r tools/requirements.txt
      - run: moon build --target js --release
      - run: python tools/verify-reference.py
      - run: python tools/verify-boundary.py
      - run: python tools/verify-facet-cycles.py
      - uses: actions/upload-artifact@v4
        with:
          name: gmsh-reference
          path: |
            evidence/reference.json
            evidence/boundary-reference.json
            evidence/facet-cycles-reference.json
